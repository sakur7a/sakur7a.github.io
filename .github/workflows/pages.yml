name: Validate and deploy unified site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.repository == 'sakur7a/sakur7a.github.io'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.repository == 'sakur7a/sakur7a.github.io'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    if: github.event_name != 'pull_request' && github.repository == 'sakur7a/sakur7a.github.io'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
