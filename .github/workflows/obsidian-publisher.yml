name: Validate Obsidian publisher

on:
  push:
    branches: [main]
    paths:
      - tools/obsidian-publisher/**
      - scripts/*.js
      - src/config/**
      - .github/workflows/obsidian-publisher.yml
  pull_request:
    branches: [main]
    paths:
      - tools/obsidian-publisher/**
      - scripts/*.js
      - src/config/**
      - .github/workflows/obsidian-publisher.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publisher:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/obsidian-publisher
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/obsidian-publisher/package-lock.json
      - run: npm ci
      - run: npm test
